<!doctype html>
<html lang="en">
<head>
<title>CCST Crew Study</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18252C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CCST Crew">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: calibration-sheet app. Sticky tab bar, single column of panels; loop-tag labels mark each block. */
:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#18252C; --muted:#5A6A72; --faint:#8A989E;
  --line:#D6DDD9; --line2:#E6EBE8; --accent:#C2410C; --accent-bg:#FBE9DF;
  --good:#2D7A4B; --good-bg:#E3F2E8; --bad:#B42318; --bad-bg:#FBE6E4; --warn:#9A6200; --warn-bg:#FBF0D9;
  --blue:#1F5F8B; --blue-bg:#E2EEF6;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171A; --sheet:#182126; --ink:#E4EBE8; --muted:#9AAAB0; --faint:#6F7F86;
  --line:#2B373D; --line2:#222D32; --accent:#F28B54; --accent-bg:#3A2418;
  --good:#6CC791; --good-bg:#18301F; --bad:#F2877D; --bad-bg:#3A1C1A; --warn:#E8B657; --warn-bg:#352A12;
  --blue:#7DB8E0; --blue-bg:#16293A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171A; --sheet:#182126; --ink:#E4EBE8; --muted:#9AAAB0; --faint:#6F7F86;
  --line:#2B373D; --line2:#222D32; --accent:#F28B54; --accent-bg:#3A2418;
  --good:#6CC791; --good-bg:#18301F; --bad:#F2877D; --bad-bg:#3A1C1A; --warn:#E8B657; --warn-bg:#352A12;
  --blue:#7DB8E0; --blue-bg:#16293A; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 6px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--faint)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 10px 7px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main section{padding-top:20px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--faint)}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.03em;border:1px solid currentColor;border-radius:999px;padding:1px 9px;color:var(--blue);white-space:nowrap}
.tag.orange{color:var(--accent)} .tag.good{color:var(--good)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.muted{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
button.btn{font-family:var(--body);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:40px}
button.btn:hover{border-color:var(--muted)}
button.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.btn.ghost{background:none;border-color:transparent;color:var(--blue);padding-inline:6px}
button.btn:disabled{opacity:.45;cursor:default}
/* signal gauge */
.gauge{position:relative;height:30px;border:1px solid var(--line);border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line2) calc(25% - 1px) 25%);overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85}
.gauge-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
/* steps */
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line2)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:13px;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted)}
ol.steps li.done::before{content:"✓";background:var(--good-bg);color:var(--good);border-color:var(--good)}
ol.steps .t{font-weight:600}
ol.steps .d{font-size:13px;color:var(--muted)}
/* cards */
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:20px;min-height:220px;display:flex;flex-direction:column;gap:14px}
.flash .meta{display:flex;gap:8px;flex-wrap:wrap}
.flash .front{font-size:19px;line-height:1.45;font-weight:500;white-space:pre-line}
.flash .back{white-space:pre-line;font-size:16px;border-top:1px dashed var(--line);padding-top:14px}
.workbox{font-family:var(--mono);font-size:14px;white-space:pre-line;background:var(--paper);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 4px 4px 0}
.whybox{background:var(--warn-bg);border-left:3px solid var(--warn);padding:10px 12px;font-size:14px;border-radius:0 4px 4px 0}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px}
.rate small{font-weight:400;font-size:11px;color:var(--muted);font-family:var(--mono)}
/* quiz */
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-size:15px;line-height:1.4;padding:11px 14px;margin:0 0 8px;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt .l{font-family:var(--mono);color:var(--muted);margin-right:8px}
.qtext{font-size:17px;font-weight:500;margin:6px 0 14px}
.feedback{border-radius:6px;padding:12px 14px;margin-top:6px;font-size:14px}
.feedback.ok{background:var(--good-bg)} .feedback.no{background:var(--bad-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--blue)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* lists */
.list{border-top:1px solid var(--line2)}
.list .it{padding:10px 0;border-bottom:1px solid var(--line2)}
.read{display:grid;grid-template-columns:minmax(9em,15em) 1fr;gap:6px 14px;font-size:14px}
.read .p{font-family:var(--mono);font-size:13px;color:var(--accent);white-space:normal}
@media (max-width:640px){.read{grid-template-columns:1fr;gap:2px}.read .p{margin-top:10px}.read .p:first-child{margin-top:0}}
ul.concepts{margin:0;padding-left:18px} ul.concepts li{margin-bottom:6px}
details.ex{border:1px solid var(--line);border-radius:6px;background:var(--sheet);margin-bottom:10px}
details.ex summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.ex[open] summary::after{content:"−"}
details.ex .body{padding:0 14px 14px}
ol.wsteps{margin:8px 0;padding-left:20px} ol.wsteps li{margin-bottom:4px}
textarea{width:100%;min-height:80px;font-family:var(--body);font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px}
input[type=date],select{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px;max-width:100%}
.timeline .blk{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.timeline .blk:first-child{border-top:0}
.timeline .when{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.4}
.timeline .now{background:var(--accent-bg);margin:0 -16px;padding-inline:16px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 4px}
a{color:var(--blue)}
@media (max-width:520px){.rate{grid-template-columns:repeat(2,1fr)} .timeline .blk{grid-template-columns:1fr} .flash .front{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.gauge .fill{transition:width .6s ease}}
</style>
</head>
<body>

<header class="top"><div class="wrap" style="padding-block:0">
  <div class="brand"><h1>CCST <span>Crew</span> Study</h1><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="sync" id="sync">Loading…</span><button class="chip" id="langbtn" type="button" data-noloc>Español</button></span></div>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="board">Board</button>
    <button role="tab" data-tab="learn">Learn</button>
    <button role="tab" data-tab="cards">Cards</button>
    <button role="tab" data-tab="practice">Practice</button>
    <button role="tab" data-tab="errors">Error log</button>
    <button role="tab" data-tab="plan">Plan</button>
    <button role="tab" data-tab="coach" id="tab-coach" hidden>Coach</button>
    <button role="tab" data-tab="method">Method</button>
  </nav>
</div></header>

<main class="wrap" id="main">
  <section id="v-today"><div class="empty">Loading your study plan…</div></section>
  <section id="v-learn" hidden></section>
  <section id="v-cards" hidden></section>
  <section id="v-practice" hidden></section>
  <section id="v-errors" hidden></section>
  <section id="v-board" hidden></section>
  <section id="v-plan" hidden></section>
  <section id="v-coach" hidden></section>
  <section id="v-method" hidden></section>
</main>

<script src="config.js"></script>
<script src="i18n-es.js"></script>
<script>
(function(){
"use strict";
const DAY=86400000;
const FILES={cards:"data/2026-10-19-ccst-cards.json",questions:"data/2026-10-19-ccst-questions.json",plan:"data/2026-10-19-ccst-plan.json"};
let D={cards:[],questions:[],plan:null};
const S={srs:{},errors:{},sessions:{},qstats:{},progress:{steps:{},days:[],examTarget:null,newPerDay:12}};
let db=null, saveMode="local";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
let LANG="en";
const LOC=()=>LANG==="es"?"es-MX":undefined;
const L=(en,es)=>LANG==="es"?es:en;
const fmtD=s=>parseD(s).toLocaleDateString(LOC(),{month:"short",day:"numeric"});
const addDays=(s,n)=>{const d=new Date(parseD(s).getTime()+n*DAY+12*3600000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const daysUntil=s=>Math.ceil((parseD(s)-parseD(todayStr()))/DAY);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BLOCKNAMES={1:"Fundamentals",2:"Measurement",3:"Calibration",4:"Control and valves",5:"Loop check, start-up, digital",6:"Troubleshooting"};
const BLOCKNAMES_EN=Object.assign({},BLOCKNAMES);
const BLOCKNAMES_ES={1:"Fundamentos",2:"Medición",3:"Calibración",4:"Control y válvulas",5:"Revisión de lazos, arranque, digital",6:"Localización de fallas"};

/* ---------- crew: Supabase sign-in + sync ---------- */
S.notes={};S.progress.stepT={};S.progress.metaT={};S.activity={};
const CONF=window.CREW_CONFIG||{};
const SB=String(CONF.url||"").replace(/\/+$/,""),ANON=CONF.anonKey||"";
const SESS_KEY="crew.session";
function sess(){try{return JSON.parse(localStorage.getItem(SESS_KEY)||"null")}catch(e){return null}}
function setSess(s){try{if(s)localStorage.setItem(SESS_KEY,JSON.stringify(s));else localStorage.removeItem(SESS_KEY)}catch(e){}}
function uid(){const s=sess();return s&&s.user&&s.user.id}
const SHARED_KEYS=new Set(["c_cards","c_questions","c_plan","contentMeta","device","ghcfg","lang"]);
function lk(k){return SHARED_KEYS.has(k)?"crew."+k:"crew.u."+(uid()||"none")+"."+k}
function lsGet(k){try{const v=localStorage.getItem(lk(k));return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(lk(k),JSON.stringify(v))}catch(e){}}
function cfg(){return sess()}
function profile(){return (ME&&ME.username)||"main"}
function deviceId(){let d=lsGet("device");if(!d){d=Math.random().toString(36).slice(2,10);lsSet("device",d)}return d}
let ME=null;
function resetState(){S.srs={};S.errors={};S.sessions={};S.qstats={};S.notes={};S.activity={};S.progress={steps:{},days:[],examTarget:null,newPerDay:12,stepT:{},metaT:{}};dirty=0;lastSync=null}
function loadLocal(){for(const k of ["srs","errors","sessions","qstats","progress","notes","activity"]){const v=lsGet(k);if(v)S[k]=Object.assign(S[k]||{},v)}
  S.progress.steps=S.progress.steps||{};S.progress.days=S.progress.days||[];S.progress.stepT=S.progress.stepT||{};S.progress.metaT=S.progress.metaT||{};if(!S.progress.newPerDay)S.progress.newPerDay=12;
  ME=lsGet("me");dirty=+(lsGet("dirty")||0);lastSync=lsGet("lastSync")}
let dirty=0;let syncT=null;let syncing=false;let lastSync=null;let syncErr=null;
function persist(coll){lsSet(coll,S[coll]);dirty++;lsSet("dirty",dirty);showSync();clearTimeout(syncT);syncT=setTimeout(()=>sync(),4000)}
function saveProgress(){persist("progress")}
function saveQstats(){persist("qstats")}
function saveNotes(){persist("notes")}
function bump(f){const d=deviceId(),t=todayStr();S.activity[d]=S.activity[d]||{};const x=S.activity[d][t]=S.activity[d][t]||{c:0,a:0,k:0};x[f]=(x[f]||0)+1;lsSet("activity",S.activity)}
function markStudied(){const t=todayStr();if(!S.progress.days.includes(t)){S.progress.days.push(t);if(S.progress.days.length>400)S.progress.days=S.progress.days.slice(-400);saveProgress()}}
function ago(ts){if(!ts)return L("never","nunca");const s=Math.round((Date.now()-ts)/1000);if(s<60)return L("just now","hace un momento");if(s<3600)return L(Math.round(s/60)+" min ago","hace "+Math.round(s/60)+" min");if(s<86400)return L(Math.round(s/3600)+" h ago","hace "+Math.round(s/3600)+" h");return L(Math.round(s/86400)+" d ago","hace "+Math.round(s/86400)+" d")}
function showSync(){const el=$("#sync");if(!el)return;
  if(!sess()||!ME){el.textContent=L("Not signed in","Sin iniciar sesión");return}
  const pre=(ME.display_name||ME.username)+" · ";let t;
  const W=n=>L(`${n} change${n>1?"s":""} waiting`,`${n} cambio${n>1?"s":""} pendiente${n>1?"s":""}`);
  if(syncing)t=L("Syncing…","Sincronizando…");
  else if(!navigator.onLine)t=dirty?L("Offline","Sin conexión")+" · "+W(dirty):L("Offline · saved on this device","Sin conexión · guardado en este dispositivo");
  else if(syncErr)t=L("Sync problem: ","Problema de sincronización: ")+syncErr;
  else t=dirty?W(dirty):L("Synced ","Sincronizado ")+ago(lastSync);
  el.textContent=pre+t;if(LANG==="es")localize()}
class SignedOut extends Error{}
async function authPost(path,body,tok){const h={"apikey":ANON,"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;
  const r=await fetch(SB+path,{method:"POST",headers:h,body:JSON.stringify(body),cache:"no-store"});let j={};try{j=await r.json()}catch(e){}return {ok:r.ok,status:r.status,j}}
function errText(j){return (j&&(j.msg||j.message||j.error_description||j.error))||""}
function saveSession(j){const s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+((j.expires_in||3600)-60)*1000,user:{id:j.user.id}};setSess(s);return s}
let refreshing=null;
async function accessToken(){let s=sess();if(!s)throw new SignedOut("signed out");
  if(Date.now()<s.expires_at)return s.access_token;
  if(!refreshing)refreshing=(async()=>{const r=await authPost("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token});
    if(!r.ok){if(r.status>=400&&r.status<500){setSess(null);throw new SignedOut("Your sign-in expired. Sign in again.")}throw new Error("couldn't renew sign-in")}
    return saveSession(r.j).access_token})().finally(()=>{refreshing=null});
  return refreshing}
async function api(path,opt={}){const t=await accessToken();
  const h=Object.assign({"apikey":ANON,"Authorization":"Bearer "+t},opt.json!==undefined?{"Content-Type":"application/json"}:{},opt.headers||{});
  const r=await fetch(SB+path,{method:opt.method||"GET",headers:h,body:opt.json!==undefined?JSON.stringify(opt.json):opt.body,cache:"no-store"});
  if(r.status===401&&!opt._retried){const s=sess();if(s){s.expires_at=0;setSess(s)}return api(path,Object.assign({},opt,{_retried:true}))}
  return r}
async function apiJSON(path,opt){const r=await api(path,opt);const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok)throw new Error(errText(j)||("server said "+r.status));return j}
const UPSERT={"Prefer":"resolution=merge-duplicates,return=minimal"};
async function crewEmail(u){const r=await fetch(SB+"/rest/v1/rpc/crew_email",{method:"POST",headers:{"apikey":ANON,"Content-Type":"application/json"},body:JSON.stringify({u:u.trim().toLowerCase()}),cache:"no-store"});
  if(!r.ok)throw new Error("can't reach the crew server");const e=await r.json();if(!e)throw new Error("the crew server isn't set up yet");return e}
function cleanUser(s){return String(s||"").trim().toLowerCase()}
const USER_RE=/^[a-z0-9][a-z0-9_.-]{2,23}$/;
async function loadMe(){const rows=await apiJSON("/rest/v1/profiles?select=id,username,display_name,role,approved&id=eq."+uid());
  ME=rows&&rows[0]?rows[0]:{removed:true};lsSet("me",ME);return ME}
function newer(a,b,f){return ((a&&a[f])||0)>=((b&&b[f])||0)?a:b}
function mergeState(L,R){
  const out={srs:{},errors:{},sessions:{},qstats:{},notes:{},progress:{},activity:{}};
  for(const k of new Set([...Object.keys(L.srs||{}),...Object.keys(R.srs||{})])){const a=(L.srs||{})[k],b=(R.srs||{})[k];out.srs[k]=!a?b:!b?a:newer(a,b,"last")}
  for(const k of new Set([...Object.keys(L.errors||{}),...Object.keys(R.errors||{})])){const a=(L.errors||{})[k],b=(R.errors||{})[k];out.errors[k]=!a?b:!b?a:newer(a,b,"t")}
  out.sessions=Object.assign({},R.sessions||{},L.sessions||{});
  for(const k of new Set([...Object.keys(L.qstats||{}),...Object.keys(R.qstats||{})])){const a=(L.qstats||{})[k],b=(R.qstats||{})[k];out.qstats[k]=!a?b:!b?a:newer(a,b,"t")}
  for(const k of new Set([...Object.keys(L.notes||{}),...Object.keys(R.notes||{})])){const a=(L.notes||{})[k],b=(R.notes||{})[k];out.notes[k]=!a?b:!b?a:newer(a,b,"t")}
  for(const dv of new Set([...Object.keys(L.activity||{}),...Object.keys(R.activity||{})])){const a=(L.activity||{})[dv]||{},b=(R.activity||{})[dv]||{};out.activity[dv]={};
    for(const day of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[day]||{},y=b[day]||{};out.activity[dv][day]={c:Math.max(x.c||0,y.c||0),a:Math.max(x.a||0,y.a||0),k:Math.max(x.k||0,y.k||0)}}}
  const lp=L.progress||{},rp=R.progress||{};const p={steps:{},stepT:{},metaT:{},days:[]};
  const keys=new Set([...Object.keys(lp.stepT||{}),...Object.keys(rp.stepT||{})]);
  for(const k of keys){const lt=(lp.stepT||{})[k]||0,rt=(rp.stepT||{})[k]||0;const [bn,key]=k.split(".");const src=lt>=rt?lp:rp;const v=!!(src.steps&&src.steps[bn]&&src.steps[bn][key]);p.steps[bn]=p.steps[bn]||{};p.steps[bn][key]=v;p.stepT[k]=Math.max(lt,rt)}
  p.days=[...new Set([...(lp.days||[]),...(rp.days||[])])].sort().slice(-400);
  for(const f of ["examTarget","startDate","newPerDay","l2"]){const lt=(lp.metaT||{})[f]||0,rt=(rp.metaT||{})[f]||0;p[f]=lt>=rt?(lp[f]??rp[f]):(rp[f]??lp[f]);p.metaT[f]=Math.max(lt,rt)}
  if(!p.newPerDay)p.newPerDay=12;
  out.progress=p;return out;
}
function isoWeek(d){d=d||new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/DAY+1)/7);return y+"-W"+String(w).padStart(2,"0")}
function weekStartStr(){const d=parseD(todayStr());const dow=(d.getDay()+6)%7;const s=new Date(d.getTime()-dow*DAY);return s.getFullYear()+"-"+String(s.getMonth()+1).padStart(2,"0")+"-"+String(s.getDate()).padStart(2,"0")}
const pts=x=>(x.c||0)+2*(x.a||0)+(x.k||0);
function computeStats(){const ws=weekStartStr();const W={c:0,a:0,k:0},T={c:0,a:0,k:0};
  for(const dv of Object.values(S.activity||{}))for(const [day,x] of Object.entries(dv)){for(const f of ["c","a","k"]){T[f]+=x[f]||0;if(day>=ws)W[f]+=x[f]||0}}
  const tasks={};const qmap=Object.fromEntries((D.questions||[]).map(q=>[q.id,q]));
  for(const [id,st] of Object.entries(S.qstats||{})){const q=qmap[id];if(!q||!q.task)continue;const t=tasks[q.task]=tasks[q.task]||[0,0];t[0]+=st.c||0;t[1]+=st.n||0}
  const blocks={};for(const n of [1,2,3,4,5,6])blocks[n]=Math.round(blockStepsDone(n)*100);
  const days=(S.progress.days||[]).slice().sort();const last=days.length?days[days.length-1]:null;
  return {user_id:uid(),week:isoWeek(),week_points:pts(W),week_answered:W.a,week_correct:W.k,week_cards:W.c,total_points:pts(T),total_answered:T.a,total_correct:T.k,total_cards:T.c,
    streak:streak(),readiness:Math.round(readiness()*100),last_active:last?new Date(parseD(last).getTime()+12*3600000).toISOString():null,blocks,tasks,updated_at:new Date().toISOString()}}
async function sync(manual){
  if(!sess()||!ME||!ME.approved||syncing)return;
  if(!navigator.onLine){showSync();return}
  syncing=true;syncErr=null;showSync();
  try{
    const wasRole=ME.role;await loadMe();
    if(ME.removed||!ME.approved){syncing=false;setupView();return}
    if(wasRole!==ME.role)applyRole();
    const rows=await apiJSON("/rest/v1/progress?select=data&user_id=eq."+uid());
    const remote=(rows&&rows[0]&&rows[0].data)||{};
    const sentDirty=dirty;
    const merged=mergeState({srs:S.srs,errors:S.errors,sessions:S.sessions,qstats:S.qstats,notes:S.notes,progress:S.progress,activity:S.activity},remote);
    const dBefore=(S.progress.startDate||"")+(S.progress.examTarget||"");Object.assign(S,merged);if(dBefore!==(S.progress.startDate||"")+(S.progress.examTarget||""))setContent();
    for(const k of ["srs","errors","sessions","qstats","progress","notes","activity"])lsSet(k,S[k]);
    const changed=JSON.stringify(mergeState(merged,merged))!==JSON.stringify(mergeState(remote,remote));
    if(changed||!rows||!rows.length)await apiJSON("/rest/v1/progress?on_conflict=user_id",{method:"POST",headers:UPSERT,json:{user_id:uid(),data:merged,updated_at:new Date().toISOString()}});
    await apiJSON("/rest/v1/stats?on_conflict=user_id",{method:"POST",headers:UPSERT,json:computeStats()});
    dirty=Math.max(0,dirty-sentDirty);lsSet("dirty",dirty);lastSync=Date.now();lsSet("lastSync",lastSync);
    await refreshContent(false);
    await loadAnnouncements();
  }catch(e){if(e instanceof SignedOut){syncing=false;ME=null;setupView(e.message);return}syncErr=(e&&e.message)||"network error"}
  syncing=false;showSync();
  if(!quizActive&&!cardActive)renderAll();
}
async function refreshContent(force){
  if(!navigator.onLine)return false;
  const rows=await apiJSON("/rest/v1/content?select=name,updated_at");
  const meta=lsGet("contentMeta")||{};let changed=false;
  for(const r of rows||[]){if(!["cards","questions","plan","reader","guide"].includes(r.name))continue;
    if(!force&&meta[r.name]===r.updated_at&&(r.name==="reader"||r.name==="guide"||lsGet("c_"+r.name)))continue;
    const d=await apiJSON("/rest/v1/content?select=data&name=eq."+encodeURIComponent(r.name));if(!d||!d[0])continue;
    if(r.name==="reader")meta.readerInfo=d[0].data;else if(r.name==="guide")meta.guideInfo=d[0].data;else lsSet("c_"+r.name,d[0].data);
    meta[r.name]=r.updated_at;changed=true}
  lsSet("contentMeta",meta);
  if(changed)setContent();
  return changed;
}

let readerURL=null;
function readerInfo(){return (lsGet("contentMeta")||{}).readerInfo||null}
async function readerBlob(fetchIt){const info=readerInfo();if(!info)return null;
  let cache=null;try{cache=await caches.open("crew-reader")}catch(e){}
  const key="./__reader/"+encodeURIComponent(info.updated||"v")+".pdf";
  if(cache){const hit=await cache.match(key);if(hit)return await hit.blob()}
  if(!fetchIt)return null;
  const r=await api("/storage/v1/object/authenticated/reader/"+encodeURIComponent(info.file));
  if(!r.ok)throw new Error("couldn't download the Reader ("+r.status+")");
  const blob=await r.blob();
  if(cache){for(const k of await cache.keys())await cache.delete(k);await cache.put(key,new Response(blob,{headers:{"Content-Type":"application/pdf"}}))}
  return blob}
async function prepReader(fetchIt){const box=$("#reader-box");if(!box)return;const info=readerInfo();
  if(!info){box.innerHTML=`<span class="small muted">The Reader PDF hasn't been published to the crew yet.</span>`;return}
  try{if(!readerURL){const b=await readerBlob(fetchIt);if(b)readerURL=URL.createObjectURL(new Blob([b],{type:"application/pdf"}))}
    if(!$("#reader-box"))return;
    if(readerURL)box.innerHTML=`<a class="btn primary" href="${readerURL}" target="_blank" rel="noopener">Open the Reader PDF</a><span class="small muted">Saved on this phone for offline use. "Reader pp." below are its page numbers.</span>`;
    else box.innerHTML=`<button class="btn" id="reader-get">Download the Reader (${Math.round((info.size||0)/1048576)||"?"} MB)</button><span class="small muted">Once, then it works offline.</span>`;
    const g=$("#reader-get");if(g)g.addEventListener("click",async()=>{g.disabled=true;g.textContent="Downloading…";try{await prepReader(true)}catch(e){box.innerHTML=`<span class="err">${esc(e.message)}</span>`}});

async function publishContent(repo,tok,say){

  let plan=null;

    say("Copying "+name+"…");const r=await gh(file,true);if(r.status===401||r.status===403)throw new Error("GitHub rejected the access key");if(!r.ok)throw new Error("couldn't read "+file+" ("+r.status+")");

    await apiJSON("/rest/v1/content?on_conflict=name",{method:"POST",headers:UPSERT,json:{name,data,updated_at:new Date().toISOString()}})}
  const rf=plan&&plan.reader&&plan.reader.file;

    const blob=await r.blob();const up=await api("/storage/v1/object/reader/ccst-reader.pdf",{method:"POST",headers:{"x-upsert":"true","Content-Type":"application/pdf","cache-control":"3600"},body:blob});
    if(!up.ok){let j={};try{j=await up.json()}catch(e){}throw new Error("Reader upload failed: "+(errText(j)||up.status))}
    await apiJSON("/rest/v1/content?on_conflict=name",{method:"POST",headers:UPSERT,json:{name:"reader",data:{file:"ccst-reader.pdf",source:rf,size:blob.size,pages:plan.reader.pages,updated:new Date().toISOString()},updated_at:new Date().toISOString()}})}
  const gf=plan&&plan.i18n&&plan.i18n.guide&&plan.i18n.guide.file;
  if(gf){say("Copying the Spanish study guide…");const r=await gh("content/"+gf,true);if(!r.ok)throw new Error("couldn't read the Spanish guide ("+r.status+")");
    const blob=await r.blob();const up=await api("/storage/v1/object/reader/guia-es.pdf",{method:"POST",headers:{"x-upsert":"true","Content-Type":"application/pdf","cache-control":"3600"},body:blob});
    if(!up.ok){let j={};try{j=await up.json()}catch(e){}throw new Error("Spanish guide upload failed: "+(errText(j)||up.status))}
    await apiJSON("/rest/v1/content?on_conflict=name",{method:"POST",headers:UPSERT,json:{name:"guide",data:{file:"guia-es.pdf",source:gf,size:blob.size,pages:plan.i18n.guide.pages,updated:new Date().toISOString()},updated_at:new Date().toISOString()}})}
}

function examTarget(){return D.plan.examTarget}
function currentBlock(){const t=todayStr();const b=D.plan.blocks.find(b=>t>=b.start&&t<=b.end);if(b)return b;return t<D.plan.blocks[0].start?D.plan.blocks[0]:D.plan.blocks[D.plan.blocks.length-1]}
function readyBlocks(){return D.plan.blocks.filter(b=>b.ready&&b.n>=1&&b.n<=6).map(b=>b.n)}
function streak(){const set=new Set(S.progress.days);let n=0;let d=parseD(todayStr());if(!set.has(todayStr()))d=new Date(d-DAY);while(true){const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(set.has(s)){n++;d=new Date(d-DAY)}else break}return n}
function dueCards(){const now=Date.now();return D.cards.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=now)}
function newToday(){const t=todayStr();return D.cards.filter(c=>S.srs[c.id]&&S.srs[c.id].first===t).length}
function newCardsAvail(blockFilter){return D.cards.filter(c=>!S.srs[c.id]&&(blockFilter?c.block===blockFilter:true))}
function learnedCount(){return D.cards.filter(c=>S.srs[c.id]&&S.srs[c.id].ivl>=1).length}
function openErrors(){return Object.values(S.errors).filter(e=>!e.resolved)}
function accuracy(days){const since=Date.now()-days*DAY;let c=0,t=0;Object.values(S.sessions).forEach(s=>{if(s.ts>=since){c+=s.score;t+=s.total}});return t?Math.round(c/t*100):null}
function stepDone(bn,key){return !!(S.progress.steps[bn]&&S.progress.steps[bn][key])}
function setStep(bn,key,v){S.progress.steps[bn]=S.progress.steps[bn]||{};S.progress.steps[bn][key]=v;S.progress.stepT=S.progress.stepT||{};S.progress.stepT[bn+"."+key]=Date.now();saveProgress()}
function blockStepsDone(bn){const keys=["pretest","learn","explain","cards","mixed","errors"];return keys.filter(k=>stepDone(bn,k)).length/keys.length}
function readiness(){const bl=[1,2,3,4,5,6];let s=0;bl.forEach(n=>s+=blockStepsDone(n));return s/bl.length}

function tTopic(t){return LANG==="es"&&window.CREW_ES&&CREW_ES.topics&&CREW_ES.topics[t]||t}
function setContent(){

  Object.assign(BLOCKNAMES,es?BLOCKNAMES_ES:BLOCKNAMES_EN);

  if(es&&p.i18n&&p.i18n.es){for(const [k,v] of Object.entries(p.i18n.es)){const parts=k.split(".");let o=p;for(let i=0;i<parts.length-1&&o;i++)o=o[parts[i]];const last=parts[parts.length-1];if(o&&last in o)o[last]=v}}
  personalize(p);D.plan=p}
function ensureStart(){if(!S.progress.startDate&&D.plan){S.progress.startDate=todayStr();S.progress.metaT=S.progress.metaT||{};S.progress.metaT.startDate=1;saveProgress();setContent()}}
function personalize(p){
  const P0=p.startDate,T0=p.examTarget;const span0=Math.max(1,Math.round((parseD(T0)-parseD(P0))/DAY));
  p.planStart=P0;p.planTarget=T0;
  const s=S.progress.startDate||todayStr();
  let t=S.progress.examTarget;
  if(!t||t<=s)t=(T0>s&&daysBetween(s,T0)>=42)?T0:addDays(s,span0);
  const span=Math.max(7,daysBetween(s,t));
  const starts=p.blocks.map(b=>Math.round(daysBetween(P0,b.start)/span0*span));
  p.blocks.forEach((b,i)=>{b.start=addDays(s,starts[i]);const nx=i<p.blocks.length-1?starts[i+1]-1:span;b.end=addDays(s,Math.max(starts[i],nx))});
  p.startDate=s;p.examTarget=t;
  p.milestones=[
    {date:addDays(t,-50),label:L("Confirm your ISA application is approved and your exam fee is paid. Check ISA's deadline for your exam window.","Confirma que tu solicitud ante ISA esté aprobada y que la cuota del examen esté pagada. Revisa la fecha límite de ISA para tu ventana de examen.")},

/* ---------- UI translation (Spanish) ---------- */
const ESX=()=>(window.CREW_ES&&CREW_ES.ui)||{};
const MON=/\b\d{1,2} (?:ene|feb|mar|abr|may|jun|jul|ago|sept?|oct|nov|dic)\.?(?= |$|\W)/g;
function tr(s){const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return null;const X=ESX();
  if(X[t]!=null)return X[t];
  const keep=[];let k=t.replace(MON,m=>{keep.push(m);return "§"}).replace(/\d[\d,]*(?:\.\d+)?/g,m=>{keep.push(m);return "#"});
  if(k!==t&&X[k]!=null){let i=0;return X[k].replace(/[#§]/g,()=>keep[i++]??"")}
  for(const [re,rp] of ((window.CREW_ES&&CREW_ES.pat)||[])){const m=t.match(re);if(m)return t.replace(re,rp)}
  return null}
let locBusy=false,locQueued=false;
function localize(){if(LANG!=="es"||locBusy)return;locBusy=true;
  try{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest("script,style,textarea,[data-noloc]"))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
    const todo=[];let n;while(n=w.nextNode()){if(n._loc===n.nodeValue)continue;const r=tr(n.nodeValue);if(r!=null){const lead=n.nodeValue.match(/^\s*/)[0],trail=n.nodeValue.match(/\s*$/)[0];todo.push([n,lead+r+trail])}else n._loc=n.nodeValue}
    for(const [nd,v] of todo){if(nd._en==null)nd._en=nd.nodeValue;nd.nodeValue=v;nd._loc=v}
    document.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{if(el.closest("[data-noloc]"))return;for(const a of ["placeholder","aria-label","title"]){const v=el.getAttribute(a);const dk="l"+a.replace(/-/g,"");if(!v||el.dataset[dk]===v)continue;const r=tr(v);if(r!=null){if(el.dataset["o"+dk]==null)el.dataset["o"+dk]=v;el.setAttribute(a,r);el.dataset[dk]=r}}})}
  finally{locObs.takeRecords();locBusy=false}}
function unlocalize(){locBusy=true;try{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n._en!=null&&n._loc===n.nodeValue){n.nodeValue=n._en}n._en=null;n._loc=null}
    document.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{for(const a of ["placeholder","aria-label","title"]){const dk="l"+a.replace(/-/g,"");const o=el.dataset["o"+dk];if(o!=null&&el.getAttribute(a)===el.dataset[dk])el.setAttribute(a,o);delete el.dataset["o"+dk];delete el.dataset[dk]}})}
  finally{locObs.takeRecords();locBusy=false}}
const locObs=new MutationObserver(()=>{if(LANG!=="es"||locBusy||locQueued)return;locQueued=true;queueMicrotask(()=>{locQueued=false;localize()})});
locObs.observe(document.body,{childList:true,subtree:true,characterData:true});
$("#langbtn").addEventListener("click",()=>setLang(LANG==="es"?"en":"es"));

async function guideBlob(fetchIt){const info=guideInfo();if(!info)return null;let cache=null;try{cache=await caches.open("crew-guide")}catch(e){}
  const key="./__guide/"+encodeURIComponent(info.updated||"v")+".pdf";if(cache){const hit=await cache.match(key);if(hit)return await hit.blob()}
  if(!fetchIt)return null;const r=await api("/storage/v1/object/authenticated/reader/"+encodeURIComponent(info.file));if(!r.ok)throw new Error("no se pudo descargar la guía ("+r.status+")");
  const blob=await r.blob();if(cache){for(const k of await cache.keys())await cache.delete(k);await cache.put(key,new Response(blob,{headers:{"Content-Type":"application/pdf"}}))}return blob}
async function prepGuide(fetchIt){const box=$("#guide-box");if(!box)return;const info=guideInfo();
  if(!info){box.innerHTML=`<span class="small muted">Tu coach todavía no ha publicado la guía en español.</span>`;return}
  try{if(!guideURL){const b=await guideBlob(fetchIt);if(b)guideURL=URL.createObjectURL(new Blob([b],{type:"application/pdf"}))}
    if(!$("#guide-box"))return;
    if(guideURL)box.innerHTML=`<a class="btn primary" href="${guideURL}" target="_blank" rel="noopener">Abrir la Guía de estudio en español</a><span class="small muted">Guardada en este teléfono para usarla sin conexión.</span>`;
    else box.innerHTML=`<button class="btn" id="guide-get">Descargar la guía en español (${Math.max(1,Math.round((info.size||0)/1048576))} MB)</button><span class="small muted">Una vez, y luego funciona sin conexión.</span>`;
    const g=$("#guide-get");if(g)g.addEventListener("click",async()=>{g.disabled=true;g.textContent="Descargando…";try{await prepGuide(true)}catch(e){box.innerHTML=`<span class="err">${esc(e.message)}</span>`}});
  }catch(e){box.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
function glossaryPanel(){const G=(lsGet("c_plan")||{}).i18n;const g=G&&G.glossary;if(LANG!=="es"||!g||!g.length)return "";
  return `<details class="ex" style="margin-top:14px"><summary>Glosario inglés–español (${g.length} términos)</summary><div class="body" data-noloc><input id="gl-q" placeholder="Buscar un término…" style="width:100%;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--sheet);color:var(--ink);margin-bottom:8px">
  <div class="read" id="gl-list">${g.map(([en,es])=>`<span class="p" lang="en">${esc(en)}</span><span>${esc(es)}</span>`).join("")}</div></div></details>`}
function wireGlossary(){const q=$("#gl-q");if(!q)return;const G=(lsGet("c_plan")||{}).i18n.glossary;

function go(what,bn){

  else if(what==="diag"){showTab("practice");startQuiz({mode:"diagnostic"})}
}

/* ---------- CARDS (spaced repetition) ---------- */
let cardActive=false,cq=[],cIdx=0,cRevealed=false,cFilter=0,cDone=0;
function rCards(){
  cardActive=false;
  const v=$("#v-cards");
  const blocks=[...new Set(D.cards.map(c=>c.block))].sort();
  const due=dueCards().filter(c=>!cFilter||c.block===cFilter);
  const newLeft=Math.max(0,S.progress.newPerDay-newToday());
  const nAvail=newCardsAvail(cFilter||null);
  const total=D.cards.length;const seen=D.cards.filter(c=>S.srs[c.id]).length;
  const nextDue=Object.values(S.srs).map(s=>s.due).filter(d=>d>Date.now()).sort((a,b)=>a-b)[0];
  v.innerHTML=`<h2>Cards</h2><p class="lede">Retrieval practice with spacing. Answer in your head (or on paper for math) before you reveal. Rate honestly; the schedule depends on it.</p>
  <div class="stats">
    <div class="stat"><div class="k">Due now</div><div class="v">${due.length}</div></div>
    <div class="stat"><div class="k">New today</div><div class="v">${Math.min(newLeft,nAvail.length)}</div><div class="s">limit ${S.progress.newPerDay}/day</div></div>
    <div class="stat"><div class="k">Seen</div><div class="v">${seen}/${total}</div></div>
    <div class="stat"><div class="k">Learned</div><div class="v">${learnedCount()}</div><div class="s">interval ≥ 1 day</div></div>
  </div>
  <div class="panel"><div class="row">
    <label class="small muted" for="cf">Block</label><select id="cf"><option value="0">All blocks</option>${blocks.map(b=>`<option value="${b}" ${cFilter===b?"selected":""}>Block ${b}: ${BLOCKNAMES[b]}</option>`).join("")}</select>
    <label class="small muted" for="npd">New per day</label><select id="npd">${[5,8,12,15,20,30].map(n=>`<option ${S.progress.newPerDay===n?"selected":""}>${n}</option>`).join("")}</select>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="cstart" ${due.length+Math.min(newLeft,nAvail.length)===0?"disabled":""}>Start review (${due.length+Math.min(newLeft,nAvail.length)})</button>
  ${nAvail.length&&newLeft===0?`<button class="btn" id="cextra">Learn 5 more new</button>`:""}</div>
  ${due.length+Math.min(newLeft,nAvail.length)===0?`<p class="small muted" style="margin:10px 0 0">${nextDue?L("All caught up. Next card is due ","Todo al día. La próxima tarjeta toca el ")+new Date(nextDue).toLocaleString(LOC(),{weekday:"short",hour:"numeric",minute:"2-digit"})+".":L("All caught up.","Todo al día.")} ${L("Coming back tomorrow beats cramming today.","Regresar mañana rinde más que estudiar todo de golpe hoy.")}</p>`:""}
  </div>
  <div class="panel"><h3>Card types</h3><div class="read"><span class="tag">fact</span><span>Definitions and numbers you need cold.</span><span class="tag warn">why</span><span>Say the reason out loud before revealing. These build understanding.</span><span class="tag orange">calc</span><span>Work it on paper. The reveal shows each step.</span></div></div>`;
  $("#cf").addEventListener("change",e=>{cFilter=+e.target.value;rCards()});
  $("#npd").addEventListener("change",e=>{S.progress.newPerDay=+e.target.value;S.progress.metaT.newPerDay=Date.now();saveProgress();rCards()});
  const st=$("#cstart");if(st)st.addEventListener("click",()=>{const q=shuffle(due).concat(nAvail.slice(0,newLeft));startCards(q)});
  const ex=$("#cextra");if(ex)ex.addEventListener("click",()=>startCards(nAvail.slice(0,5)));
}
function startCards(q){cq=interleave(q);cIdx=0;cDone=0;cardActive=true;cRevealed=false;showCard()}
function interleave(q){const due=q.filter(c=>S.srs[c.id]);const nw=q.filter(c=>!S.srs[c.id]);const out=[];let i=0,j=0;while(i<due.length||j<nw.length){if(i<due.length)out.push(due[i++]);if(i<due.length)out.push(due[i++]);if(j<nw.length)out.push(nw[j++])}return out}
function nextIvls(c){const s=S.srs[c.id];const ease=s?s.ease:2.5;const ivl=s?s.ivl:0;
  const g=!s||ivl<1?1:(s.reps===1?3:Math.round(ivl*ease));
  return {again:"10 min",hard:fmtIvl(!s||ivl<1?1:Math.max(1,Math.round(ivl*1.2))),good:fmtIvl(g),easy:fmtIvl(!s||ivl<1?4:Math.round(ivl*ease*1.3))}}
function fmtIvl(d){d=Math.min(d,60);return d<30?d+"d":Math.round(d/30*10)/10+"mo"}
function showCard(){
  const v=$("#v-cards");
  if(cIdx>=cq.length){cardActive=false;markStudied();
    v.innerHTML=`<h2>Session done</h2><p class="lede">${cDone} cards reviewed. Come back tomorrow for the next batch. Spacing only works if you leave gaps.</p><div class="row"><button class="btn primary" id="cback">Back to cards</button><button class="btn" id="cgo">Practice questions</button></div>`;
    $("#cback").addEventListener("click",rCards);$("#cgo").addEventListener("click",()=>showTab("practice"));
    if(!stepDone(currentBlock().n,"cards")&&cDone>=10){setStep(currentBlock().n,"cards",true)}
    return}
  const c=cq[cIdx];const isNew=!S.srs[c.id];const iv=nextIvls(c);
  const typeTag=c.type==="calc"?`<span class="tag orange">calc</span>`:c.type==="why"?`<span class="tag warn">why</span>`:`<span class="tag">fact</span>`;
  v.innerHTML=`<div class="spread"><span class="small muted">${cIdx+1} of ${cq.length}</span><button class="btn ghost" id="cquit">End session</button></div>
  <div class="bar"><i style="width:${(cIdx/cq.length*100).toFixed(1)}%"></i></div>
  <div class="flash">
    <div class="meta">${typeTag}<span class="tag muted">B${c.block} · ${esc(c.topic)}</span>${isNew?`<span class="tag good">new</span>`:""}</div>
    <div class="front">${esc(c.front)}</div>
    ${c.en?enBox("cen",`<div><b>${esc(c.en.front)}</b></div>${cRevealed?`<div style="margin-top:6px">${esc(c.en.back)}</div>${c.en.steps?`<div class="workbox" style="margin-top:6px">${esc(c.en.steps)}</div>`:""}${c.en.explain?`<div style="margin-top:6px">${esc(c.en.explain)}</div>`:""}`:""}`):""}
    ${!cRevealed?`<p class="small muted" style="margin:0">${c.type==="calc"?"Work it out on paper first.":c.type==="why"?"Explain the reason out loud first.":"Answer in your head first."}</p>
      <button class="btn primary" id="crev">Show answer <span class="kbd">space</span></button>`
    :`<div class="back">${esc(c.back)}</div>
      ${c.steps?`<div class="workbox">${esc(c.steps)}</div>`:""}
      ${c.explain?`<div class="whybox"><b>Why it works:</b> ${esc(c.explain)}</div>`:""}
      <div class="rate">
        <button class="btn" data-r="again">Again<small>${iv.again}</small></button>
        <button class="btn" data-r="hard">Hard<small>${iv.hard}</small></button>
        <button class="btn primary" data-r="good">Good<small>${iv.good}</small></button>
        <button class="btn" data-r="easy">Easy<small>${iv.easy}</small></button>
      </div><p class="small muted" style="margin:0">Keys: 1 Again · 2 Hard · 3 Good · 4 Easy</p>`}
  </div>`;
  $("#cquit").addEventListener("click",()=>{cIdx=cq.length;showCard()});
  const rv=$("#crev");if(rv)rv.addEventListener("click",()=>{cRevealed=true;showCard()});wireEN(v);
  v.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>rate(c,b.dataset.r)));
}
function rate(c,r){
  bump("c");const now=Date.now();let s=S.srs[c.id]?Object.assign({},S.srs[c.id]):{ivl:0,ease:2.5,reps:0,lapses:0,first:todayStr()};
  if(r==="again"){s.lapses+=(s.reps>0?1:0);s.ease=Math.max(1.3,s.ease-0.2);s.ivl=0;s.reps=0;s.due=now+10*60000;cq.push(c)}
  else{
    let d;
    if(r==="hard"){d=s.ivl<1?1:Math.max(1,Math.round(s.ivl*1.2));s.ease=Math.max(1.3,s.ease-0.15)}
    else if(r==="good"){d=s.ivl<1?1:(s.reps===1?3:Math.round(s.ivl*s.ease))}
    else {d=s.ivl<1?4:Math.round(s.ivl*s.ease*1.3);s.ease+=0.15}
    d=Math.min(d,60);s.ivl=d;s.reps+=1;
    const due=new Date();due.setHours(4,0,0,0);s.due=due.getTime()+d*DAY;
  }
  s.last=now;S.srs[c.id]=s;persist("srs",c.id,s);
  cDone++;cIdx++;cRevealed=false;showCard();
}
document.addEventListener("keydown",e=>{

function inPool(q){return q.level!==2||!!S.progress.l2}
function QP(){return D.questions.filter(inPool)}
function bpTasks(){return (D.plan&&D.plan.blueprint&&D.plan.blueprint.tasks)||[]}
function takeN(a,k){return shuffle(a).slice(0,k)}
function bpPick(pool,n,pick){
  const T=bpTasks();if(!T.length)return pick(pool,n);
  const W=Object.fromEntries(T.map(t=>[t.task,t.pct]));
  const by={};pool.forEach(q=>{const t=W[q.task]?q.task:"_";(by[t]=by[t]||[]).push(q)});
  const keys=Object.keys(by);const w=k=>k==="_"?0.5:W[k];
  const quota={};keys.forEach(k=>quota[k]=0);
  let left=Math.min(n,pool.length);let active=keys.slice();
  while(left>0&&active.length){
    const tw=active.reduce((s,k)=>s+w(k),0);let given=0;
    const want=active.map(k=>({k,x:left*w(k)/tw}));
    want.forEach(o=>{const g=Math.min(by[o.k].length-quota[o.k],Math.floor(o.x));quota[o.k]+=g;given+=g});
    if(given===0){want.sort((a,b)=>(b.x%1)-(a.x%1)||Math.random()-.5);for(const o of want){if(given>=left)break;if(by[o.k].length>quota[o.k]){quota[o.k]++;given++}}}
    if(given===0)break;left-=given;active=active.filter(k=>by[k].length>quota[k])}
  let out=[];keys.forEach(k=>{if(quota[k])out=out.concat(pick(by[k],quota[k]))});
  return shuffle(out)}
function coveragePanel(){const T=bpTasks();if(!T.length)return "";
  const st={};D.questions.filter(q=>q.level!==2).forEach(q=>{const s=st[q.task]=st[q.task]||{n:0,a:0,c:0};s.n++;const x=S.qstats[q.id];if(x){s.a+=x.n;s.c+=x.c}});
  const doms=D.plan.blueprint.domains;
  return `<div class="panel"><h3>Exam blueprint coverage</h3><p class="small muted" style="margin:0 0 4px">Each task's share of the real exam (${esc(D.plan.blueprint.source)}), the questions the app has for it, and your accuracy so far. Put extra time into high-% tasks under 75%.</p>${Object.keys(doms).map(d=>{const ts=T.filter(t=>String(t.dom)===d);const pct=ts.reduce((s,t)=>s+t.pct,0);
    return `<div style="margin-top:12px"><b>Domain ${d}: ${esc(doms[d])}</b> <span class="small muted">· ${pct}% of exam</span><div class="list">${ts.slice().sort((a,b)=>b.pct-a.pct).map(t=>{const s=st[t.task]||{n:0,a:0,c:0};const acc=s.a?Math.round(s.c/s.a*100):null;
      return `<div class="it spread" style="flex-wrap:nowrap;gap:10px"><span style="flex:1;min-width:0">${esc(t.name)}<br><span class="small muted">Task ${t.task} · ${t.pct}% of exam · ${s.n} questions${s.a?" · "+s.a+" answered":""}</span></span><span style="flex-shrink:0" class="tag ${acc===null?"muted":acc>=75?"good":acc>=50?"warn":"bad"}">${acc===null?"–":acc+"%"}</span></div>`}).join("")}</div></div>`}).join("")}</div>`}
function weightPick(pool,n){
  const w=pool.map(q=>{const st=S.qstats[q.id];const e=S.errors[q.id];let x=1;if(!st)x+=1;if(e&&!e.resolved)x+=3;else if(st&&st.c<st.n)x+=1;return {q,k:Math.random()**(1/x)}});
  return w.sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.q);
}
function fixedOrder(q){const o=((q.en&&q.en.opts)||q.opts||[]);return o.some(t=>/\b(all|none) of (the )?above\b|\bboth [A-D]\b|\b[A-D] and [A-D]\b|^(true|false)\.?$/i.test(String(t).trim()))}
function startQuiz(o){
  let pool,label,n;
  if(o.mode==="pretest"){pool=QP().filter(q=>q.block===o.block);const unseen=pool.filter(q=>!S.qstats[q.id]);pool=shuffle(unseen.length>=10?unseen:pool).slice(0,10);label=L(`Block ${o.block} pre-test`,`Pre-test del bloque ${o.block}`)}
  else if(o.mode==="block"){pool=shuffle(QP().filter(q=>q.block===o.block)).slice(0,15);label=L(`Block ${o.block} quiz`,`Quiz del bloque ${o.block}`)}
  else if(o.mode==="mixed"){const upto=Math.max(o.block||1,1);let p=QP().filter(q=>q.block<=upto);if(p.length<20)p=QP();pool=bpPick(p,20,weightPick);label=L("Mixed set","Set mixto")}
  else if(o.mode==="exam"){const all=QP();n=Math.min(o.n,all.length);pool=bpPick(all,n,takeN);label=L(`Timed exam (${n})`,`Examen cronometrado (${n})`)}
  else if(o.mode==="diagnostic"){pool=bpPick(D.questions.filter(q=>q.level!==2),20,takeN);label=L("Diagnostic","Diagnóstico")}
  else if(o.mode==="l2"){pool=takeN(D.questions.filter(q=>q.level===2),20);label=L("Level II bonus set","Set extra de Nivel II")}
  else if(o.mode==="errors"){pool=shuffle(D.questions.filter(q=>S.errors[q.id]&&!S.errors[q.id].resolved));label=L("Error retest","Volver a probar errores")}
  if(!pool.length){return}
  Q={mode:o.mode,block:o.block,label,items:pool.map(q=>({q,order:(fixedOrder(q)?[0,1,2,3].slice(0,q.opts.length):shuffle([0,1,2,3].slice(0,q.opts.length))),pick:null,reason:null})),i:0,start:Date.now(),timed:o.mode==="exam",limit:o.mode==="exam"?pool.length*96:0,answered:false};
  quizActive=true;showQ();
  if(Q.timed){clearInterval(Q.tick);Q.tick=setInterval(tickTimer,1000)}
}
function tickTimer(){if(!Q||!Q.timed){return}const left=Q.limit-Math.floor((Date.now()-Q.start)/1000);const el=$("#qtimer");if(el)el.textContent=fmtSecs(Math.max(0,left));if(left<=0){clearInterval(Q.tick);finishQuiz()}}
function fmtSecs(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")}

    <div class="qtext">${esc(q.q)}</div>
    ${q.en?enBox("qen",`<div style="font-weight:500">${esc(q.en.q)}</div><ol type="A" style="margin:6px 0 0;padding-left:22px">${it.order.map(oi=>`<li>${esc(q.en.opts[oi])}</li>`).join("")}</ol>${answered?`<div class="small" style="margin-top:6px">${esc(q.en.exp)}</div>`:""}`):""}
    <div id="opts">${it.order.map((oi,k)=>{let cls="opt";if(answered){if(oi===q.a)cls+=" ok";else if(oi===it.pick)cls+=" no"}else if(it.pick===oi)cls+=" sel";return `<button class="${cls}" data-o="${oi}" ${answered?"disabled":""}><span class="l">${LET[k]}</span>${esc(q.opts[oi])}</button>`}).join("")}</div>

      ${it.pick!==q.a?`<div style="margin-top:10px"><span class="small muted">Why did you miss it? This goes in your error log.</span><div class="chips">${REASONS.map(r=>`<button class="chip" data-reason="${esc(r)}" aria-pressed="${it.reason===r}">${esc(r)}</button>`).join("")}</div></div>`:""}`:""}
    <div class="row" style="margin-top:14px">
      ${Q.timed?`<button class="btn" id="qprev" ${Q.i===0?"disabled":""}>Back</button><button class="btn primary" id="qnext">${Q.i===Q.items.length-1?"Finish":"Next"}</button>`
      :answered?`<button class="btn primary" id="qnext">${Q.i===Q.items.length-1?"See results":"Next question"}</button>`:`<button class="btn primary" id="qcheck">Check answer</button>`}
    </div>
  </div>`;
  v.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{if(answered)return;it.pick=+b.dataset.o;$("#qerr").textContent="";v.querySelectorAll("[data-o]").forEach(x=>x.classList.toggle("sel",x===b))}));

  const ck=$("#qcheck");if(ck)ck.addEventListener("click",()=>{if(it.pick===null){$("#qerr").textContent="Pick an answer first.";return}Q.answered=true;record(q,it.pick===q.a);showQ()});
  const nx=$("#qnext");if(nx)nx.addEventListener("click",()=>{
    if(Q.timed&&it.pick===null&&!confirmSkip(it)){return}
    if(Q.i<Q.items.length-1){Q.i++;Q.answered=false;showQ()}else finishQuiz()});

}
function confirmSkip(it){if(it._skipWarned)return true;it._skipWarned=true;$("#qerr").textContent="No answer picked. Tap Next again to skip it (it counts as wrong).";return false}
function record(q,ok){
  bump("a");if(ok)bump("k");
  const st=S.qstats[q.id]||{n:0,c:0};st.n++;if(ok)st.c++;st.last=ok?1:0;st.t=Date.now();S.qstats[q.id]=st;saveQstats();
  const e=S.errors[q.id];
  if(!ok)logError(q,null,true);
  else if(e&&!e.resolved){const ne=Object.assign({},e,{streak:(e.streak||0)+1});if(ne.streak>=2)ne.resolved=true;ne.t=Date.now();S.errors[q.id]=ne;persist("errors",q.id,ne)}
}
function logError(q,reason,isMiss){
  const e=Object.assign({qid:q.id,misses:0,streak:0,resolved:false,reason:"Didn't know it"},S.errors[q.id]||{});
  if(isMiss){e.misses++;e.streak=0;e.resolved=false;e.last=Date.now()}
  if(reason)e.reason=reason;
  e.t=Date.now();S.errors[q.id]=e;persist("errors",q.id,e);
}

    if(Q.mode==="pretest")setStep(Q.block,"pretest",true);if(Q.mode==="mixed"&&total>=15)setStep(currentBlock().n,"mixed",true)}

  <div class="panel"><h3>By topic</h3><div class="list">${Object.entries(byT).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([t,[c,n]])=>`<div class="it spread"><span>${esc(t)}</span><span class="tag ${c===n?"good":c/n>=0.5?"warn":"bad"}">${c}/${n}</span></div>`).join("")}</div></div>
  ${Q.mode==="pretest"?`<div class="panel"><p style="margin:0">Pre-test done. Low scores here are normal and useful: you now know what to look for while reading. Next: <b>Learn</b>.</p></div>`:""}
  ${misses.length?`<div class="panel"><h3>Review your misses</h3>${misses.map(it=>`<div class="it" style="padding:10px 0;border-bottom:1px solid var(--line2)"><div style="font-weight:500">${esc(it.q.q)}</div><div class="small" style="margin-top:4px"><span style="color:var(--bad)">${it.pick===null?L("No answer","Sin respuesta"):L("You: ","Tú: ")+esc(it.q.opts[it.pick])}</span> · <span style="color:var(--good)">${L("Answer","Respuesta")}: ${esc(it.q.opts[it.q.a])}</span></div><div class="small muted" style="margin-top:4px">${esc(it.q.exp)}</div></div>`).join("")}<p class="small muted" style="margin:10px 0 0">All misses are in your error log. Tag why you missed them there.</p></div>`:""}

}

/* ---------- ERRORS ---------- */
let eFilter="open";
function rErrors(){
  const v=$("#v-errors");const qmap=Object.fromEntries(D.questions.map(q=>[q.id,q]));
  let list=Object.values(S.errors).filter(e=>qmap[e.qid]);
  const open=list.filter(e=>!e.resolved);
  const byReason={};open.forEach(e=>byReason[e.reason]=(byReason[e.reason]||0)+1);
  const byTopic={};open.forEach(e=>{const t=qmap[e.qid].topic;byTopic[t]=(byTopic[t]||0)+1});
  if(eFilter==="open")list=open;else if(eFilter==="cleared")list=list.filter(e=>e.resolved);
  list.sort((a,b)=>(b.misses-a.misses)||(b.last-a.last));

    <div class="panel"><h3>Why you miss</h3>${Object.keys(byReason).length?`<div class="list">${Object.entries(byReason).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<div class="it spread"><span>${esc(r)}</span><span class="tag muted">${n}</span></div>`).join("")}</div>`:`<p class="small muted" style="margin:0">Nothing logged yet.</p>`}</div>
    <div class="panel"><h3>Weakest topics</h3>${Object.keys(byTopic).length?`<div class="list">${Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,n])=>`<div class="it spread"><span>${esc(t)}</span><span class="tag bad">${n}</span></div>`).join("")}</div>`:`<p class="small muted" style="margin:0">Nothing logged yet.</p>`}</div>
  </div>
  <div class="panel"><div class="spread"><div class="row"><button class="chip" data-ef="open" aria-pressed="${eFilter==="open"}">Open (${open.length})</button><button class="chip" data-ef="cleared" aria-pressed="${eFilter==="cleared"}">Cleared</button><button class="chip" data-ef="all" aria-pressed="${eFilter==="all"}">All</button></div>
  <button class="btn primary" id="eretest" ${open.length?"":"disabled"}>Retest open (${open.length})</button></div>
  ${list.length?`<div class="list" style="margin-top:12px">${list.map(e=>{const q=qmap[e.qid];return `<details class="ex" style="margin:10px 0 0"><summary><span>${esc(q.q)}<br><span class="small muted">${esc(q.topic)} · ${L("missed","fallada")} ${e.misses}× ${e.resolved?"· "+L("cleared","resuelta"):"· "+(e.streak||0)+"/2 "+L("correct","correctas")}</span></span></summary><div class="body">

  <p class="small muted" style="margin:10px 0 0">A miss clears after you get it right twice in a row in later sessions.</p></div>`;
  v.querySelectorAll("[data-ef]").forEach(b=>b.addEventListener("click",()=>{eFilter=b.dataset.ef;rErrors()}));
  v.querySelectorAll("[data-er]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();const q=qmap[b.dataset.er];logError(q,b.dataset.reason,false);b.parentElement.querySelectorAll("[data-reason]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"))}));
  const rt=$("#eretest");if(rt)rt.addEventListener("click",()=>{showTab("practice");startQuiz({mode:"errors"});if(open.length)setStep(currentBlock().n,"errors",true)});

function rPlan(){
  const v=$("#v-plan");const t=todayStr();
  const sd=D.plan.startDate,ed=examTarget(),span=daysBetween(sd,ed);
  v.innerHTML=`<h2>Plan</h2><p class="lede">Your own schedule: ${D.plan.blocks.length} stages from your start date to your target exam date. Each study block runs the same six-step loop. Change either date and the blocks stretch or shrink to fit.</p>
  <div class="panel"><h3>Your dates</h3><div class="grid2"><label class="small"><b>Start date</b><br><input type="date" id="sdt" value="${sd}" max="${addDays(ed,-14)}" style="width:100%"></label><label class="small"><b>Target exam date</b><br><input type="date" id="ed" value="${ed}" min="${addDays(sd,14)}" style="width:100%"></label></div>
    <p class="small muted" id="dmsg" style="margin:8px 0 0">${span} days of study${span<56?". That's tight: under 8 weeks leaves only a few days per block.":", about "+Math.round(span/7)+" weeks."} Book your exam window with ISA; these dates only set your study pace.</p></div>
  <div class="panel"><h3>Language</h3><div class="row"><button class="chip" data-lang="en" data-noloc aria-pressed="${LANG==="en"}">English</button><button class="chip" data-lang="es" data-noloc aria-pressed="${LANG==="es"}">Español</button></div><p class="small muted" style="margin:8px 0 0">Changes the app and the study content on this phone. Exam terms stay in English in parentheses, because the ISA exam is in English.</p></div>
  ${syncPanel()}
  <div class="panel"><h3>Key dates</h3><div class="read">${D.plan.milestones.map(m=>`<span class="p">${fmtD(m.date)}</span><span>${esc(m.label)}${daysUntil(m.date)>=0?` <span class="small muted">· in ${daysUntil(m.date)} days</span>`:""}</span>`).join("")}</div></div>
  ${coveragePanel()}
  <div class="panel timeline">${D.plan.blocks.map(b=>{const now=t>=b.start&&t<=b.end;const past=t>b.end;const pct=b.n>=1&&b.n<=6?Math.round(blockStepsDone(b.n)*100):null;
    return `<div class="blk ${now?"now":""}"><div class="when">${fmtD(b.start)}<br>– ${fmtD(b.end)}</div><div><div class="spread"><b>${b.n>=1&&b.n<=6?"Block "+b.n+": ":""}${esc(b.title)}</b><span class="row">${now?`<span class="tag orange">now</span>`:past?`<span class="tag muted">past</span>`:""}${pct!==null?`<span class="tag ${pct===100?"good":"muted"}">${pct}%</span>`:""}${b.n>=1&&b.n<=6&&!b.ready?`<span class="tag warn">content coming</span>`:""}</span></div><div class="small muted" style="margin-top:2px">${esc(b.summary)}</div>${b.steps?`<ul class="concepts small" style="margin-top:6px">${b.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</div></div>`}).join("")}</div>`;
  wireSyncPanel();
  const setD=(f,val)=>{if(!val)return;S.progress[f]=val;S.progress.metaT=S.progress.metaT||{};S.progress.metaT[f]=Date.now();saveProgress();setContent();rPlan()};
  $("#ed").addEventListener("change",e=>{if(e.target.value&&e.target.value>D.plan.startDate)setD("examTarget",e.target.value)});
  $("#sdt").addEventListener("change",e=>{if(e.target.value&&e.target.value<examTarget())setD("startDate",e.target.value)});
  v.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
}

/* ---------- METHOD ---------- */
function rMethod(){
  const rows=[
    ["Retrieval practice","Cards and quizzes make you pull answers from memory instead of re-reading.","g = 0.61 across 217 studies","Adesope et al. 2017","https://www.learningscientists.org/blog/2017/2/9-1"],
    ["Spacing","The card scheduler spreads reviews out, with gaps that grow toward weeks as the exam gets closer.","Best gap ≈ 10–20% of the time until the test","Cepeda et al. 2008","https://pubmed.ncbi.nlm.nih.gov/19076480/"],
    ["Self-explanation","\"Why\" cards and Explain prompts make you say the reason, not just the answer.","g = 0.55 across 64 studies","Bisra et al. 2018","https://bps.org.uk/research-digest/self-explanation-powerful-learning-technique-according-meta-analysis-64-studies"],
    ["Worked examples","Solved problems shown step by step before you solve similar ones.","g = 0.48 for math","Barbieri et al. 2023","https://www.learningscientists.org/blog/2024/1/25-1"],
    ["Interleaving","Mixed sets combine look-alike problems (zero vs. span, suppression vs. elevation) so you learn to tell them apart.","g = 0.42 overall","Brunmair and Richter 2019","https://www.psychologie.uni-wuerzburg.de/fileadmin/06020400/2019/Brunmair_Richter_in_press__2019_META-ANALYSIS_OF_INTERLEAVED_LEARNING.pdf"],
    ["Pre-testing","Each block starts with a cold quiz. Wrong guesses still improve what you take from the reading.","Rated high-utility with practice testing","Dunlosky et al. 2013","https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html"]
  ];
  $("#v-method").innerHTML=`<h2>Why it's built this way</h2><p class="lede">Each part of this system maps to a study method with strong evidence behind it. Re-reading, highlighting and cramming were rated low-utility, so they're left out.</p>
  ${rows.map(r=>`<div class="panel"><div class="spread"><h3 style="margin:0">${r[0]}</h3><span class="tag">${esc(r[2])}</span></div><p style="margin:6px 0 4px">${esc(r[1])}</p><a class="small" href="${r[4]}" target="_blank" rel="noopener">${esc(r[3])}</a></div>`).join("")}
  <div class="panel"><h3>Daily routine</h3><div class="read"><span class="p">15–20 min</span><span>Cards, every day, same time if you can.</span><span class="p">30–45 min</span><span>Weekdays: readings and worked examples for the current block.</span><span class="p">45–60 min</span><span>One weekend session: mixed set, then the error log.</span></div></div>
  <div class="panel"><h3>Sources for the questions</h3><p class="small muted" style="margin:0">Main source: the ISA CCST Level I Study Guide, 4th edition (v4.3, May 2024), with ISA's answer key and its exam blueprint of tasks and weights. Also: the earlier Level I guide, the ISA TS00 review course surveys and practice exams, ISA course pretests, practice sets written for this system, and an optional Level II Study Guide bonus set. Each question shows its source. Where ISA's key looks wrong, the question carries an answer key note. Explanations were written for this system.</p></div>`;
}

/* ---------- boot ---------- */
async function boot(){
  LANG=lsGet("lang")==="es"?"es":"en";document.documentElement.lang=LANG;$("#langbtn").textContent=LANG==="es"?"English":"Español";
  if(SB&&ANON&&await handleRecovery()){localize();return}
  loadLocal();
  setContent();
  if(!SB||!ANON||!sess()||!ME||ME.removed||!ME.approved){setupView();
    if(SB&&sess()&&navigator.onLine){try{await loadMe();if(ME.approved)await enterApp();else setupView()}catch(e){if(e instanceof SignedOut)setupView(e.message)}}
    return}
  if(!D.plan){await enterApp();return}
  ensureStart();
  $("#tabs").hidden=false;applyRole();showSync();renderAll();sync();
}
boot();
if("serviceWorker" in navigator){const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{})})}
})();
</script>
